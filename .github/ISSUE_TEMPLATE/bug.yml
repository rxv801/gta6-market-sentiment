name: Bug
description: Something is broken (collector failure, wrong number, failing test)
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw vs what you expected. Paste error text if short.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
  - type: input
    id: since
    attributes:
      label: Since when
      description: Date or run ID when it first appeared
