name: Stock prices

on:
  schedule:
    # Weeknights after the US close. The second run is a backstop because GitHub can skip scheduled runs.
    - cron: "23 22 * * 1-5"
    - cron: "23 4 * * 2-6"
  workflow_dispatch:
    inputs:
      backfill:
        description: Fetch everything since 2021
        type: boolean
        default: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Save prices
        run: uv run python -m extract.stocks ${{ inputs.backfill && '--backfill' || '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
