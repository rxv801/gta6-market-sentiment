name: YouTube retention

on:
  schedule:
    # Daily. Nothing is old enough to delete until 6 Dec 2026, when the first row turns 30 days old.
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Delete expired YouTube rows
        run: uv run python -m maintenance.retention
        env:
          JANITOR_DATABASE_URL: ${{ secrets.JANITOR_DATABASE_URL }}
          # Set this repository variable to 1095 only if YouTube grants the III.L permission.
          YOUTUBE_RETENTION_DAYS: ${{ vars.YOUTUBE_RETENTION_DAYS }}
