name: YouTube collector

on:
  schedule:
    # Twice a day because GitHub can skip scheduled runs. Staging keeps one reading per video per day.
    - cron: "37 1 * * *"
    - cron: "37 13 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Save video stats
        run: uv run python -m extract.youtube
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
